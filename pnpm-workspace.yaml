packages:
  - packages/*
  - playground
  - docs

# pnpm 11 build-script approval (replaces the old `onlyBuiltDependencies` list).
allowBuilds:
  '@prisma/engines': true
  prisma: true
  msgpackr-extract: true
  protobufjs: true
  better-sqlite3: true
  sharp: true
  # binary ships as an optional dep (@esbuild/<platform>); its postinstall is a no-op
  esbuild: false

confirmModulesPurge: false

minimumReleaseAgeExclude:
  - '@rudderjs/*'

overrides:
  # Pin a single @rudderjs/core copy across the tree. @rudderjs/log and
  # @rudderjs/localization declare `^1.7.0`, which pnpm resolved to a second
  # 1.12.2 copy instead of deduping onto the 1.13.0 the rest of the tree uses.
  # Two copies = nominally-incompatible Application/Container types, which 500s
  # the playground typecheck on bootstrap/providers.ts.
  '@rudderjs/core': 1.13.2
  react: 19.2.6
  react-dom: 19.2.6
  '@tiptap/core': 3.26.0
  '@tiptap/pm': 3.26.0
  '@tiptap/extensions': 3.26.0
  '@tiptap/starter-kit': 3.26.0
  '@tiptap/react': 3.26.0
  '@tiptap/suggestion': 3.26.0
  '@tiptap/extension-placeholder': 3.26.0
  '@tiptap/extension-link': 3.26.0
  '@tiptap/extension-color': 3.26.0
  '@tiptap/extension-details': 3.26.0
  '@tiptap/extension-highlight': 3.26.0
  '@tiptap/extension-image': 3.26.0
  '@tiptap/extension-subscript': 3.26.0
  '@tiptap/extension-superscript': 3.26.0
  '@tiptap/extension-table': 3.26.0
  '@tiptap/extension-text-align': 3.26.0
  '@tiptap/extension-text-style': 3.26.0
  '@tiptap/extension-underline': 3.26.0
