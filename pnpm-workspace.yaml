packages:
  - packages/*
  - playground
  - docs

# pnpm 11 build-script approval (replaces the old `onlyBuiltDependencies` list).
allowBuilds:
  '@prisma/engines': true
  prisma: true
  msgpackr-extract: true
  protobufjs: true
  better-sqlite3: true
  sharp: true
  # binary ships as an optional dep (@esbuild/<platform>); its postinstall is a no-op
  esbuild: false

confirmModulesPurge: false

minimumReleaseAgeExclude:
  - '@rudderjs/cache@1.5.2'
  - '@rudderjs/contracts@1.18.0'
  - '@rudderjs/middleware@1.2.3'
  - '@rudderjs/server-hono@1.9.0'
  - '@rudderjs/sync@1.9.0'
  - '@rudderjs/view@1.4.0'
  - '@rudderjs/vite@2.11.2'

overrides:
  react: 19.2.6
  react-dom: 19.2.6
  '@tiptap/core': 3.26.0
  '@tiptap/pm': 3.26.0
  '@tiptap/extensions': 3.26.0
  '@tiptap/starter-kit': 3.26.0
  '@tiptap/react': 3.26.0
  '@tiptap/suggestion': 3.26.0
  '@tiptap/extension-placeholder': 3.26.0
  '@tiptap/extension-link': 3.26.0
  '@tiptap/extension-color': 3.26.0
  '@tiptap/extension-details': 3.26.0
  '@tiptap/extension-highlight': 3.26.0
  '@tiptap/extension-image': 3.26.0
  '@tiptap/extension-subscript': 3.26.0
  '@tiptap/extension-superscript': 3.26.0
  '@tiptap/extension-table': 3.26.0
  '@tiptap/extension-text-align': 3.26.0
  '@tiptap/extension-text-style': 3.26.0
  '@tiptap/extension-underline': 3.26.0
